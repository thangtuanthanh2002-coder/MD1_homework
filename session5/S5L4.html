<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rotate Div</title>

    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: green;
            font-size: 20px;
            transition: transform 0.5s;
        }

        div:hover {
            transform: rotate(45deg);
        }
    </style>
</head>

<body>

    <div>Di chuột vào tôi!</div>

</body>
</html>
