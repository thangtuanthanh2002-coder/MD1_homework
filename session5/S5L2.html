<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>List Hover</title>

    <style>
        ul {
            width: 600px;
        }

        li {
            list-style: none;
            background-color: #c0c0c0;
            color: white;
            padding: 14px;
            margin-bottom: 10px;
        }

        /* Khi đưa chuột vào */
        li:hover {
            background-color: #666666;
        }
    </style>
</head>

<body>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>

</body>
</html>
