<!DOCTYPE html>
<html>
<head>
    <style>
        button {
            background-color: #eee;
            color: black;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
        }

        button.clicked {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

    <button onclick="doiMau(this)">Click me</button>

    <script>
        function doiMau(button) {
            button.classList.toggle("clicked");
        }
    </script>

</body>
</html>
