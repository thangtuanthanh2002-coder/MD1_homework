<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fade In</title>

    <style>
        .box {
            width: 520px;
            height: 320px;
            background-color: #aaa8af;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box h1 {
            color: white;
            font-size: 60px;
            animation: fadeIn 3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Fade in</h1>
    </div>

</body>
</html>
