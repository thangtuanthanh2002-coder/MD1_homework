<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin sản phẩm</title>

    <style>
        table {
            border: 1px solid gray;
            border-spacing: 15px;
            margin: 20px;
        }

        th, td {
            border: 1px solid gray;
            padding: 15px;
            font-size: 22px;
            text-align: left;
        }

        th {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>Loại sản phẩm</th>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
    </tr>

    <tr>
        <td rowspan="2">Điện tử</td>
        <td>Laptop</td>
        <td>15.000.000</td>
    </tr>

    <tr>
        <td>Điện thoại</td>
        <td>8.000.000</td>
    </tr>

    <tr>
        <td>Gia dụng</td>
        <td>Máy giặt</td>
        <td>5.000.000</td>
    </tr>
</table>

</body>
</html>
