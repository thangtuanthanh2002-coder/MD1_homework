<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form liên hệ</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 22px;
            margin: 20px 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 220px;
            height: 25px;
            font-size: 18px;
        }

        textarea {
            width: 520px;
            height: 90px;
            font-size: 18px;
        }

        button {
            font-size: 18px;
            padding: 3px 10px;
        }
    </style>
</head>

<body>

    <form>
        <div class="form-group">
            <label for="hoten">Họ và tên:</label>
            <input type="text" id="hoten" name="hoten">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="tinhan">Tin nhắn:</label>
            <textarea id="tinhan" name="tinhan"></textarea>
        </div>

        <button type="submit">Gửi</button>
    </form>

</body>
</html>
