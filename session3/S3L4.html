<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng thông tin</title>

    <style>
        table {
            border: 1px solid gray;
            padding: 20px;
            border-spacing: 20px;
        }

        th, td {
            border: 1px solid gray;
            padding: 20px;
            font-size: 28px;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Tên</th>
            <th>Tuổi</th>
            <th>Nghề nghiệp</th>
        </tr>

        <tr>
            <td>An</td>
            <td>25</td>
            <td>Lập trình viên</td>
        </tr>

        <tr>
            <td>Bảo</td>
            <td>30</td>
            <td>Kỹ sư xây dựng</td>
        </tr>

        <tr>
            <td>Chi</td>
            <td>22</td>
            <td>Sinh viên</td>
        </tr>
    </table>

</body>
</html>
