<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sở thích của bạn</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 560px;
            background-color: #d9ffff;
            border: 1px solid gray;
            padding: 15px 20px;
        }

        .title {
            background-color: orangered;
            color: white;
            text-align: center;
            font-size: 20px;
            padding: 5px;
            margin-bottom: 10px;
        }

        .row {
            margin: 8px 0;
        }

        label {
            display: inline-block;
            width: 110px;
            color: #5555aa;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 240px;
            height: 25px;
        }

        .hobbies {
            display: inline-block;
            width: 400px;
        }

        .hobbies label {
            width: auto;
            color: #ff9966;
            font-weight: normal;
            margin-right: 25px;
        }

        .buttons {
            margin-left: 110px;
            margin-top: 10px;
        }

        button {
            margin-right: 5px;
            padding: 5px 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="title">
        SỞ THÍCH CỦA BẠN
    </div>

    <form>

        <div class="row">
            <label>Họ và tên</label>
            <input type="text" name="fullname">
        </div>

        <div class="row">
            <label>Email</label>
            <input type="email" name="email">
        </div>

        <div class="row">
            <label>Sở thích</label>

            <div class="hobbies">
                <label>
                    <input type="checkbox" name="hobby" value="thethao">
                    Thể thao
                </label>

                <label>
                    <input type="checkbox" name="hobby" value="amnhac">
                    Âm nhạc
                </label>

                <label>
                    <input type="checkbox" name="hobby" value="docsach">
                    Đọc sách
                </label>

                <br>

                <label>
                    <input type="checkbox" name="hobby" value="luotweb">
                    Lướt web
                </label>

                <label>
                    <input type="checkbox" name="hobby" value="choigame">
                    Chơi game
                </label>

                <label>
                    <input type="checkbox" name="hobby" value="dienanh">
                    Điện ảnh
                </label>

                <br>

                <label>
                    <input type="checkbox" name="hobby" value="dulich">
                    Du lịch
                </label>
            </div>
        </div>

        <div class="buttons">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>

    </form>

</div>

</body>
</html>
