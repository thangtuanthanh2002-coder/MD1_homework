<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng đơn hàng</title>

    <style>
        table {
            border: 1px solid gray;
            border-spacing: 15px;
            margin: 20px;
        }

        th, td {
            border: 1px solid gray;
            padding: 15px;
            font-size: 22px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>Tháng</th>
        <th colspan="2">Tỷ lệ đơn hàng theo tháng</th>
    </tr>

    <tr>
        <td>Nguyễn Văn A</td>
        <td>15% hoàn thành</td>
        <td>85% hủy hàng</td>
    </tr>

    <tr>
        <td>Phan Văn B</td>
        <td>25% hoàn thành</td>
        <td>75% hủy hàng</td>
    </tr>

    <tr>
        <td>Nguyễn Thị C</td>
        <td>50% hoàn thành</td>
        <td>50% hủy hàng</td>
    </tr>
</table>

</body>
</html>
