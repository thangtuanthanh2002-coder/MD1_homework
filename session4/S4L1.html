<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang web của tôi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            background-color: #333;
            color: white;
            font-size: 22px;
            padding: 6px;
            width: 80%;
            margin: 20px auto 10px;
        }

        p {
            font-size: 14px;
        }

        img {
            width: 118px;
            height: 180px;
            object-fit: cover;
        }

        .caption {
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <h1>Chào mừng đến với trang web của tôi</h1>

    <p>
        Đây là trang web đầu tiên của tôi. Tôi đang học lập trình web
        và đây là sản phẩm đầu tiên của tôi.
    </p>

    <img width="300"
        src="https://plus.unsplash.com/premium_photo-1682050733502-f58b7f499490?q=80&w=1288&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"" alt="Hình ảnh phong cảnh">

    <p class="caption">Trang web được tạo bởi tôi</p>

</body>
</html>
