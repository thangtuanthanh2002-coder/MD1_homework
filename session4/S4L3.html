<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 28px;
        }

        form {
            width: 90%;
            margin: 20px auto;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #00c853;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover {
            background-color: #00a844;
        }
    </style>
</head>

<body>

    <h1>Liên hệ với chúng tôi</h1>

    <form>
        <label>Họ và tên:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Tin nhắn:</label>
        <textarea></textarea>

        <button type="submit">Gửi</button>
    </form>

</body>
</html>
