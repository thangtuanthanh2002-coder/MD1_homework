<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang web của tôi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 80%;
            margin: 20px auto;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav {
            background-color: #ddd;
            text-align: center;
            padding: 8px;
        }

        nav a {
            color: #555;
            text-decoration: none;
            margin: 0 12px;
        }

        nav a:hover {
            color: blue;
        }
    </style>
</head>

<body>

    <header>
        <h1>Trang web của tôi</h1>
    </header>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Sản phẩm</a>
        <a href="#">Liên hệ</a>
    </nav>

</body>
</html>
