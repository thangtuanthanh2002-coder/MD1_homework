<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trích dẫn nổi bật</title>

    <style>
        .quote {
            width: 500px;
            background-color: #fff8dc;
            text-align: center;
            padding: 50px 25px 25px;
            margin: 20px auto;
        }

        .quote h1 {
            color: darkblue;
            font-size: 40px;
            margin: 0 0 25px;
        }

        .quote p {
            font-size: 25px;
            margin-bottom: 25px;
        }

        .quote button {
            font-size: 20px;
            padding: 12px 25px;
            cursor: pointer;
        }

        /* Khi di chuột vào nút */
        .quote button:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>

    <div class="quote">
        <h1>Trích dẫn nổi bật</h1>

        <p>“Kiến thức là sức mạnh.”</p>

        <button>Đọc thêm</button>
    </div>

</body>
</html>
